<!doctype html>
<html><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'">
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
  body{opacity:0;transition:opacity .35s ease}
  body.on{opacity:1}
  canvas{width:100%;height:100%;display:block}
</style></head>
<body><canvas id="c"></canvas>
<script type="module">
import { drawOrb } from './orbdraw.js';
const c = document.getElementById('c'), g = c.getContext('2d');
const D = window.devicePixelRatio || 1, S = 200;
c.width = S * D; c.height = S * D; g.scale(D, D);
const COL = { speaking: [246, 194, 82], thinking: [167, 139, 250] };
let lvl = 0, target = 0, mode = 'speaking', rgb = COL.speaking.slice();
orb.on('level', v => { target = Math.max(0, Math.min(1, Number(v) || 0)); });
orb.on('mode', m => { if (COL[m]) mode = m; });
orb.on('theme', t => { if (t && t.speaking) COL.speaking = t.speaking; if (t && t.thinking) COL.thinking = t.thinking; });
// The animation loop only exists while the orb is on screen; when it is hidden nothing is drawn at all.
let running = false, stopTimer = 0;
function startLoop() { clearTimeout(stopTimer); if (!running) { running = true; requestAnimationFrame(frame); } }
orb.on('show', () => { document.body.classList.add('on'); startLoop(); });
orb.on('hide', () => { document.body.classList.remove('on'); clearTimeout(stopTimer); stopTimer = setTimeout(() => { running = false; g.clearRect(0, 0, S, S); }, 450); }); // after the fade-out
function frame(t) {
  if (mode === 'thinking') target = 0.22 + 0.10 * Math.sin(t / 300);
  lvl += (target - lvl) * 0.25;
  const goal = COL[mode]; rgb = rgb.map((v, i) => v + (goal[i] - v) * 0.12);
  g.clearRect(0, 0, S, S);
  drawOrb(g, S, S, t, { rgb, lvl, mode, cx: S / 2, cy: S / 2, R: 34 });
  if (running) requestAnimationFrame(frame);
}
</script></body></html>
