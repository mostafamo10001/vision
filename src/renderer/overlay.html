<!doctype html><meta charset="utf-8">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:transparent}
  .ring{position:absolute;width:90px;height:90px;margin:-45px 0 0 -45px;border-radius:50%;border:4px solid #f6c252;box-shadow:0 0 24px #f6c252,inset 0 0 18px #f6c25288;animation:pulse 1.1s ease-out infinite}
  .ring.r2{animation-delay:.55s}
  .dot{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:#f6c252;box-shadow:0 0 12px #f6c252}
  .label{position:absolute;transform:translate(-50%,34px);padding:6px 12px;border-radius:8px;background:rgba(10,14,19,.92);color:#fff;font:600 14px 'Segoe UI',sans-serif;border:1px solid #f6c252;white-space:nowrap}
  @keyframes pulse{0%{transform:scale(.4);opacity:1}100%{transform:scale(1.5);opacity:0}}
</style>
<div id="o"></div>
<script>
  const q = new URLSearchParams(location.search), x = +q.get('x') || 0, y = +q.get('y') || 0, label = q.get('label') || '';
  const o = document.getElementById('o');
  for (const c of ['ring', 'ring r2', 'dot']) { const d = document.createElement('div'); d.className = c; d.style.left = x + 'px'; d.style.top = y + 'px'; o.appendChild(d); }
  if (label) { const l = document.createElement('div'); l.className = 'label'; l.textContent = label; l.style.left = x + 'px'; l.style.top = y + 'px'; o.appendChild(l); }
</script>
