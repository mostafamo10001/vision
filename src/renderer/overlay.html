<!doctype html><meta charset="utf-8">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:transparent}
  .ring{position:absolute;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;border:2px solid #e8ce96;box-shadow:0 0 22px rgba(232,206,150,.7),inset 0 0 16px rgba(232,206,150,.35);animation:pulse 1.2s ease-out infinite}
  .ring.r2{animation-delay:.6s}
  .dot{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:#fff;box-shadow:0 0 14px #e8ce96,0 0 4px #fff}
  .label{position:absolute;transform:translate(-50%,32px);padding:6px 13px;border-radius:999px;background:rgba(8,11,16,.92);color:#eef1f8;font:600 13px 'Segoe UI Variable Text','Segoe UI',sans-serif;letter-spacing:.01em;border:1px solid rgba(232,206,150,.6);white-space:nowrap}
  @keyframes pulse{0%{transform:scale(.4);opacity:1}100%{transform:scale(1.5);opacity:0}}
</style>
<div id="o"></div>
<script>
  const q = new URLSearchParams(location.search), x = +q.get('x') || 0, y = +q.get('y') || 0, label = q.get('label') || '';
  const o = document.getElementById('o');
  for (const c of ['ring', 'ring r2', 'dot']) { const d = document.createElement('div'); d.className = c; d.style.left = x + 'px'; d.style.top = y + 'px'; o.appendChild(d); }
  if (label) { const l = document.createElement('div'); l.className = 'label'; l.textContent = label; l.style.left = x + 'px'; l.style.top = y + 'px'; o.appendChild(l); }
</script>
